[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = ['@openzeppelin/=lib/openzeppelin-contracts/', '@prb-math/=lib/prb-math/src/', "@murky/=lib/murky/src/"]

optimizer = true
optimizer_runs = 200